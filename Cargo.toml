# Mercury — virtual cargo workspace.
#
# Crates are added under `crates/` as each compiler stage is implemented. The default build needs no
# external toolchain: the interpreter and the Cranelift native backend are pure Rust, and the LLVM
# backend only emits textual IR (no inkwell). Only the GPU backend is opt-in, behind `--features gpu`.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aidan <aidantran120@gmail.com>"]
rust-version = "1.94"
repository = "https://github.com/aidan/mercury"

[workspace.dependencies]
# Internal crates are registered here as they are created, so members can depend on them
# with `{ workspace = true }`.
mercury_span = { path = "crates/mercury_span" }
mercury_diag = { path = "crates/mercury_diag" }
mercury_lexer = { path = "crates/mercury_lexer" }
mercury_driver = { path = "crates/mercury_driver" }
mercury_ast = { path = "crates/mercury_ast" }
mercury_parser = { path = "crates/mercury_parser" }
mercury_types = { path = "crates/mercury_types" }
mercury_sema = { path = "crates/mercury_sema" }
mercury_mir = { path = "crates/mercury_mir" }
mercury_mir_build = { path = "crates/mercury_mir_build" }
mercury_backend = { path = "crates/mercury_backend" }
mercury_interp = { path = "crates/mercury_interp" }
mercury_opt = { path = "crates/mercury_opt" }
mercury_codegen_llvm = { path = "crates/mercury_codegen_llvm" }
mercury_codegen_cranelift = { path = "crates/mercury_codegen_cranelift" }
mercury_codegen_gpu = { path = "crates/mercury_codegen_gpu" }
mercury_runtime = { path = "crates/mercury_runtime" }
mercury_autodiff = { path = "crates/mercury_autodiff" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
