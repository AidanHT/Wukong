[package]
name = "mercury_codegen_gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# The GPU backend: Mercury emits PTX text and driver-JIT-loads it via `cudarc`
# (`cuModuleLoadData` — the NVIDIA driver's built-in PTX→SASS JIT needs no `nvcc`/`ptxas`).
# All GPU code is behind the `gpu` feature so the toolchain-free CPU core (`cargo test`) never
# pulls in `cudarc` or needs a GPU. `cudarc` uses `dynamic-loading` (dlopens `nvcuda.dll`), so even
# with the feature on, building needs no CUDA toolkit — only running needs the driver + a device.

[dependencies]
cudarc = { version = "0.16", default-features = false, features = [
    "driver",
    "dynamic-loading",
    "cuda-12060",
    "f16",
    # `std` gates cudarc's `impl std::error::Error` for DriverError/CublasError/CompileError, so the
    # peer baselines can unify the three error families behind one boxed error with `?`.
    "std",
    # Honest GPU peer baselines (Phase 0 of the GPU plan): cuBLAS is the Tier-B gold-standard
    # GEMM peer; NVRTC compiles the Tier-A naive CUDA-C baseline at runtime. Both dlopen their
    # redistributable DLLs (cublas64_12.dll / nvrtc64_120_0.dll) exactly like the driver does for
    # nvcuda.dll — so *building* still needs no toolkit; only *running the peer benches* needs the
    # DLLs reachable (we point at a local `tools/cuda-redist` via PATH; see baselines.rs).
    "cublas",
    # cuBLASLt — the only cuBLAS surface that does **fp8 (E4M3) matmul** (`cublasLtMatmul`); the
    # classic `cublasGemmEx` (the `cublas` feature) has no fp8 path. cudarc's *safe* LT wrapper is
    # f32/f16/bf16-only, so the fp8 peer (baselines.rs) drives the raw `cublaslt::{sys,result}` layer
    # directly. dlopens `cublasLt64_12.dll` like the others — building still needs no toolkit.
    "cublaslt",
    "nvrtc",
], optional = true }
# Used (only under `gpu`) by the tolerance harness as the CPU oracle: the GPU kernels are diffed
# against the *identical* runtime kernels the interpreter marshals (vmath / sreduce / norm).
mercury_runtime = { workspace = true, optional = true }
# f16/bf16 host-side conversion for the tensor-core path (low-precision in, f32 accumulate).
half = { version = "2", optional = true }

[features]
gpu = ["dep:cudarc", "dep:mercury_runtime", "dep:half"]
