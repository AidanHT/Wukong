[package]
name = "mercury_driver"
description = "Pipeline orchestration for the Mercury compiler (Session, options, --emit)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
mercury_span = { workspace = true }
mercury_diag = { workspace = true }
mercury_lexer = { workspace = true }
mercury_ast = { workspace = true }
mercury_parser = { workspace = true }
mercury_sema = { workspace = true }
mercury_mir = { workspace = true }
mercury_mir_build = { workspace = true }
mercury_backend = { workspace = true }
mercury_interp = { workspace = true }
mercury_opt = { workspace = true }
mercury_codegen_llvm = { workspace = true }
mercury_codegen_cranelift = { workspace = true }
# Reverse-mode autodiff: powers the `--emit=grad` stage and `--train` mode (differentiate a `.mer`
# loss function into its backward MIR, then run fwd→bwd→optimizer training steps).
mercury_autodiff = { workspace = true }
# The GPU backend (`--backend=gpu`) is opt-in: behind the driver's `gpu` feature so the default
# build stays toolchain-free (no `cudarc`, no device needed). Enabling it turns on the offloading
# interpreter path in `compile()`.
mercury_codegen_gpu = { workspace = true, optional = true }

[features]
gpu = ["dep:mercury_codegen_gpu", "mercury_codegen_gpu/gpu"]
