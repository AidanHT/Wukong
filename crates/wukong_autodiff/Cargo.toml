[package]
name = "wukong_autodiff"
description = "Reverse-mode automatic differentiation as a MIR->MIR transform (the backward path for training)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Opt in to the workspace lint policy (`-D warnings`; see the workspace `Cargo.toml`), so a warning
# here fails a plain local `cargo build` / `cargo clippy`, not only CI's `RUSTFLAGS`.
[lints]
workspace = true

[dependencies]
wukong_mir = { workspace = true }
wukong_span = { workspace = true }

[dev-dependencies]
# The finite-difference gradient gate runs forward + backward MIR on the interpreter oracle.
wukong_interp = { workspace = true }
