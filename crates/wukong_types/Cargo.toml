[package]
name = "wukong_types"
description = "Wukong's type vocabulary: scalars, SIMD vectors, shape-typed tensors, layouts."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Opt in to the workspace lint policy (`-D warnings`; see the workspace `Cargo.toml`), so a warning
# here fails a plain local `cargo build` / `cargo clippy`, not only CI's `RUSTFLAGS`.
[lints]
workspace = true

[dependencies]
wukong_span = { workspace = true }
