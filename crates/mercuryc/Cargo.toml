[package]
name = "mercuryc"
description = "The Mercury compiler command-line driver."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "mercuryc"
path = "src/main.rs"

[dependencies]
mercury_driver = { workspace = true }

[features]
# Opt-in GPU backend (`--backend=gpu`): pulls `cudarc` in via the driver. Off by default so the
# stock `mercuryc` stays toolchain-free.
gpu = ["mercury_driver/gpu"]
