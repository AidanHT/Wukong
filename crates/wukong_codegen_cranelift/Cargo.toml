[package]
name = "wukong_codegen_cranelift"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
wukong_mir = { workspace = true }
wukong_span = { workspace = true }
wukong_backend = { workspace = true }
wukong_runtime = { workspace = true }

# For `wukong_opt::alias`, the MIR provenance analysis. This backend is the consumer that turns a
# no-alias proof into something the machine sees: a Cranelift `AliasRegion` on the load/store, which
# is the only channel Cranelift 0.124 offers for "these two accesses are disjoint". Layering is
# respected — `wukong_opt` sits below every backend and does not depend on any of them.
wukong_opt = { workspace = true }

cranelift-codegen = "0.124"
cranelift-frontend = "0.124"
cranelift-module = "0.124"
cranelift-jit = "0.124"
cranelift-native = "0.124"
cranelift-object = "0.124"

# Data-parallel per-function codegen: `emit_object` compiles independent functions concurrently and
# defines them into the object in source order (byte-identical to serial). Already a workspace dep
# (wukong_runtime's @parallel). Kill-switch: WUKONG_PAR_CODEGEN=0.
rayon = "1"

# Correct-by-construction x86-64 encoder for the P4 raw-AVX2 emitter (`avx2.rs`): the general
# vectorizer's 256-bit path, which Cranelift's 128-bit CLIF vector ISA cannot legalize. `code_asm`
# gives a labelled assembler (VEX/ModRM/branch fixups handled) so the differential gate only has to
# police semantics, not byte encodings. Isolated to this crate — never leaks into mir/interp.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "code_asm"] }

[dev-dependencies]
wukong_parser = { workspace = true }
wukong_sema = { workspace = true }
wukong_mir_build = { workspace = true }
wukong_interp = { workspace = true }
