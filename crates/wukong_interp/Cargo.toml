[package]
name = "wukong_interp"
description = "A from-scratch MIR interpreter: reference execution and differential-testing oracle."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
wukong_span = { workspace = true }
wukong_mir = { workspace = true }
wukong_backend = { workspace = true }
# The interpreter calls the *same* tuned kernels the native backend does (e.g. wukong_sgemm),
# marshalling its abstract memory through real buffers, so the differential oracle stays bit-exact.
wukong_runtime = { workspace = true }

[dev-dependencies]
wukong_parser = { workspace = true }
wukong_sema = { workspace = true }
wukong_mir_build = { workspace = true }
