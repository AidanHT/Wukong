[package]
name = "wukong_opt"
description = "The Wukong optimizer: a pass manager and MIR transforms."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Opt in to the workspace lint policy (`-D warnings`; see the workspace `Cargo.toml`), so a warning
# here fails a plain local `cargo build` / `cargo clippy`, not only CI's `RUSTFLAGS`.
[lints]
workspace = true

[dependencies]
wukong_mir = { workspace = true }
wukong_span = { workspace = true }
# The per-function phases run on a private pool (`src/parallel.rs`); the version the Cranelift
# backend and the runtime already lock.
rayon = "1"

[dev-dependencies]
wukong_parser = { workspace = true }
wukong_sema = { workspace = true }
wukong_mir_build = { workspace = true }
wukong_interp = { workspace = true }
