name: CI

# WHAT THIS DOES NOT FIX, stated because the obvious reading is wrong. Adding `sota/**` does not
# make CI cover the campaign branches: `pull_request:` already carries no branch filter, so a PR
# into any base - `sota/campaign-2026-09` included - has always run the full matrix. The binding
# reason no campaign branch has ever been built is that nothing is PUSHED. `git branch -r` lists one
# ref, `origin/main`, and HEAD is several hundred commits ahead of it; the off-main model is
# deliberate (AGENT-PROTOCOL.md "Base and branches"). This entry is the half that is in the file's
# power: it makes the run happen the moment a campaign branch IS pushed, instead of requiring
# whoever pushes to remember to open a PR first. The other half is a push, and no workflow file can
# perform it.
on:
  push:
    # Campaign work lives off-main on long-lived branch families (AGENT-PROTOCOL.md "Base and
    # branches"): `sota/**` workstreams, `gap*/**` gap-closeout branches, `integrate/**` integration
    # bases and `closeout/**` continuation branches. A PR into any base already runs the full matrix
    # (`pull_request:` carries no branch filter), but campaign branches are merged directly far more
    # often than they are PR'd, so the only way CI sees them is a push trigger that names the family.
    # Listing them here makes the two-OS matrix, the `-D warnings` policy and the MSRV/Miri jobs fire
    # on a push to a campaign branch instead of staying dark until the one large merge to `main`.
    branches: [main, 'sota/**', 'gap*/**', 'integrate/**', 'closeout/**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build & test (no LLVM)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      # `--locked` on every command that resolves dependencies, here and below. Without it a fresh
      # runner (or any `cargo` invocation after a registry update) may silently re-resolve a caret
      # range - `cranelift-* = "0.124"`, `rayon = "1"`, `half = "2"`, `matrixmultiply = "0.3"` - and
      # a `cranelift-codegen` patch release can change the machine code this compiler emits.
      #
      # Note what that does and does not break, because the obvious claim is wrong: `determinism.rs`
      # compares three FRESH PROCESSES OF ONE BINARY, so a dependency bump cannot fail it. What a
      # silent re-resolution invalidates is comparability ACROSS builds - a measured A/B whose two
      # arms resolved differently, or a baseline captured before the bump - and `matrixmultiply` is
      # worse in kind, because it is a published peer BAR whose version moves the bar without moving
      # the report. With `--locked` a lockfile change is a visible diff and a loud failure instead of
      # an invisible re-resolution.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Install Python for LLVM verification
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify emitted LLVM corpus
        if: runner.os == 'Linux'
        env:
          WUKONG_LLVM_SEMANTICS_OUTPUT: ${{ github.workspace }}/target/llvm-semantics
        run: |
          python -m pip install llvmlite==0.44.0
          cargo build -p wukongc --locked
          python tools/verify_llvm_corpus.py --compiler target/debug/wukongc --report target/llvm-corpus-verification.json
          cargo test -p wukong_codegen_llvm --locked --lib semantic_tests::
          python crates/wukong_codegen_llvm/tools/verify_semantics.py target/llvm-semantics
          python tools/verify_math_specials.py --compiler target/debug/wukongc --output target/llvm-math-specials

      - name: Upload LLVM verification results
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: llvm-corpus-verification
          path: |
            target/llvm-corpus-verification.json
            target/llvm-math-specials/
          if-no-files-found: error

      # THE PROFILE IS THE POINT OF THIS STEP. `cargo test` above builds everything at -O0, so
      # `wukong_runtime` -- the crate whose first invariant is that each AVX2 kernel agrees with its
      # scalar twin BIT-for-bit -- was only ever verified in the profile where LLVM does the least,
      # while every performance number this project publishes comes from a release binary. A scalar
      # twin is precisely the code an optimizer rewrites hardest: at -O3 LLVM auto-vectorizes the
      # twin's inner loop and may commute a `fadd` (it is commutative in LLVM IR), which changes
      # which operand is SRC1 and therefore which NaN payload survives. `colreduce` broke that way
      # and no gate anywhere could see it.
      #
      # Scoped to this one crate deliberately. It is the only crate that asserts raw-bit agreement
      # between two independent implementations of the same arithmetic, which is the property a
      # legal codegen change can silently alter; a full `--workspace --release` would rebuild
      # Cranelift and re-run the 357-program corpus under both backends at four -O levels to
      # re-check tests that are not bit-exactness assertions. Both matrix OSes run it, because the
      # codegen decision that provokes this is per-target, not universal. `--lib` keeps it to the
      # unit tests and off the `examples/` measurement instruments.
      - name: Test (release) - wukong_runtime bit-exactness
        run: cargo test -p wukong_runtime --release --locked --lib

      # THE PROFILE IS THE POINT OF THIS STEP TOO, for a different reason than the one above. The
      # AOT link path (`--emit=exe`) is profile-specific by construction: the workspace
      # `[profile.release]` sets `lto = "thin"`, so cargo compiles `wukong_runtime` with
      # `-C linker-plugin-lto` and its rlib holds LLVM bitcode members rather than native objects.
      # MSVC `link.exe` answers `LNK1136: invalid or corrupt file` on those, and in its wake every
      # `wukong_*` symbol reads as unresolved. `exe_matches_run` was 0/4 in release for the
      # project's whole history while passing 4/4 in debug, and the debug run cannot see it - the
      # profiles hand the linker archives of different shapes.
      #
      # The fix (`rlib_holds_bitcode_members` -> `-C lto=thin -C opt-level=3` in
      # `wukong_driver::rustc_link`) was verified once, by hand, and by no gate anywhere: neither
      # this workflow nor the local ten-part gate ran a release `wukongc` test, so a release AOT
      # regression re-enters silently and the next person to notice is whoever ships a binary.
      #
      # Cost, stated in job order rather than optimistically: at this point only `wukong_runtime`
      # has been built in release (the step above). This step builds the rest of the release graph -
      # cranelift, interp, mir_build, opt, driver, autodiff, codegen_llvm, wukongc - and the
      # `wukong_bench --release` step below then REUSES most of it, so the marginal cost across the
      # whole job is the driver/autodiff/codegen_llvm/wukongc layer plus the four fixture links. The
      # links are the slow part: under `[profile.release]`'s `lto = "thin"` the driver re-runs LTO
      # over the runtime for each one.
      - name: Test (release) - wukongc AOT link (--emit=exe)
        run: cargo test -p wukongc --release --locked --test exe

      - name: Smoke-run examples
        run: |
          cargo run -p wukongc --locked -- --run examples/fib.wk
          cargo run -p wukongc --locked -- --run examples/dot.wk
          cargo run -p wukongc --locked -- --run examples/saxpy_array.wk

      - name: Optimizer effectiveness + equivalence gate
        # Release build so the heavy kernels run quickly; the harness exits non-zero if any program
        # that lowers cleanly disagrees between -O0 and -O3, so this also guards optimizer soundness.
        run: cargo run -p wukong_bench --release --locked -- tests/run examples bench/kernels

      # THE SCALAR DISPATCH ARMS, FROM COMPILED PROGRAMS. Every hosted runner has AVX2, so without a
      # cap the scalar arm of every runtime dispatcher - what an ARM or pre-Haswell user runs - is
      # reached only by the unit tests that call a twin directly, never through the dispatch
      # decision a `.wk` program actually takes. `WUKONG_MAX_ISA=scalar` (`wukong_runtime::isa`, and
      # `wukong_mir::host_supports_vec_kernels` for the compiler's raw-AVX2 loop kernels) turns every
      # probe off, so the corpus differential and opt-invariance gates and the runtime's own tests
      # run the whole program surface on the scalar arms.
      - name: Test - scalar dispatch arms (WUKONG_MAX_ISA=scalar)
        env:
          WUKONG_MAX_ISA: scalar
        run: |
          cargo test -p wukong_runtime --locked --lib
          cargo test -p wukongc --locked --test run

  # TIER 2 PLATFORMS. The `test` job above is x86-64 only, so nothing built the 100+
  # `cfg(target_arch)` guards in their non-x86 configuration, ran the Cranelift JIT or
  # `emit_object` on aarch64, or linked an executable on macOS, while the README promised `cargo
  # test` "on any machine". This job runs the `test` job's parts 1-5 (fmt, clippy, the workspace
  # tests, the runtime's release bit-exactness tests, the smoke runs and the AOT exe gate) on Apple
  # Silicon and on Linux aarch64, where every runtime kernel takes its scalar twin, plus a type
  # check of the workspace for Windows on ARM. It is `continue-on-error` while these platforms are
  # Tier 2 (README "Platform support"): a red lane is a reported gap, not a blocked merge. Promote a
  # platform to Tier 1 by removing it from this job's `continue-on-error` once its lane is green.
  platform-tier2:
    name: tier-2 platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Test (release) - wukong_runtime bit-exactness
        run: cargo test -p wukong_runtime --release --locked --lib

      - name: Smoke-run examples
        run: |
          cargo run -p wukongc --locked -- --run examples/fib.wk
          cargo run -p wukongc --locked -- --run examples/dot.wk
          cargo run -p wukongc --locked -- --run examples/saxpy_array.wk

      - name: Test (release) - wukongc AOT link (--emit=exe)
        run: cargo test -p wukongc --release --locked --test exe

  windows-arm-check:
    name: tier-2 platform (aarch64-pc-windows-msvc, check only)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-msvc-${{ hashFiles('**/Cargo.lock') }}

      - name: Check the workspace for Windows on ARM
        run: cargo check --workspace --locked --target aarch64-pc-windows-msvc

  # `cargo test --workspace` above NEVER builds the `gpu` feature, so every line of
  # `crates/wukong_codegen_gpu` (and the `gpu`-gated arms of `wukong_driver`/`wukongc`) was invisible
  # to CI: the whole crate could fail to compile and the `test` job would still be green. This job
  # closes that hole. No CUDA toolkit and no device are needed, because `cudarc` is built with
  # `dynamic-loading` (it dlopens `nvcuda.dll`/`libcuda.so` at *run* time), so the feature builds —
  # and its device-free laws RUN — on a plain runner. Mirrors the second half of the local
  # two-command gate documented in CLAUDE.md.
  gpu-check:
    name: gpu type-check + clippy + device-free laws (no device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Distinct `-gpu` suffix: this job's `target/` holds a different feature-resolution graph
          # (cudarc + friends) than the `test` job's, so sharing a key would make the two thrash
          # each other's cache on every run.
          key: ${{ runner.os }}-cargo-gpu-${{ hashFiles('**/Cargo.lock') }}

      - name: GPU type-check
        run: cargo check --features gpu --all-targets --locked

      # THE LINT SURFACE IS THE POINT OF THIS STEP. The `test` job's `cargo clippy --workspace
      # --all-targets` runs WITHOUT `--features gpu`, and without that flag `wukong_codegen_gpu`
      # compiles to an almost-empty shell (two device-free modules). So the largest crate in the
      # workspace — ~25k lines of PTX generators, launch wrappers and MIR->PTX lowering — had never
      # been linted at all. When it first was, it did not merely warn: `absurd_extreme_comparisons`
      # is deny-by-default and `gpu.rs`'s flash dispatch tripped it, behind 363 warnings. That is the
      # same shape as the month of unread red ubuntu CI that hid four real Linux defects, one step
      # earlier — an invisible surface rather than an ignored one.
      #
      # It runs `-D warnings` (workflow-level RUSTFLAGS) from day one, deliberately. A warn-only lint
      # job is strictly worse than an ignored red one: it is never even red, so it decays the moment
      # it is added. The known hazard is that CI installs *current* stable, which is newer than the
      # local toolchain, so a locally clean sweep can still go red on a lint that did not exist
      # locally — but the `test` job's clippy step has taken exactly that risk since it was written,
      # and the gpu crate is not entitled to an exemption the other 20 crates do not get. Keeping it
      # a separate job (not a step of `test`) is what makes a toolchain-drift failure attributable at
      # a glance instead of masking the test signal.
      #
      # No `-p`: the `gpu`-gated arms of `wukong_driver` and `wukongc` are part of the same dark
      # surface (`gpu_accel.rs` had three of the warnings), and scoping to one package would leave
      # them dark. Ubuntu-only is sufficient here: unlike `wukong_runtime`, this crate has no
      # `cfg(windows)`/`cfg(unix)` code, so there is no per-OS arm for a second runner to reach.
      - name: GPU clippy
        run: cargo clippy --features gpu --all-targets --locked

      # THE LAWS ARE THE POINT OF THIS STEP, and until it existed nothing anywhere ran them.
      # `wukong_driver`'s `gpu` feature carries the driver-side half of the GPU dispatch: which route a
      # recognized `C = A·Bᵀ` takes per compute capability, which shapes and which operand *values* the
      # Hopper `wgmma` seam declines before it launches, and the counter algebra that distinguishes "the
      # wgmma family ran" from "it declined and the pre-Hopper launcher ran". Every one of those rules is
      # a pure function of a capability and a shape, tested as such in `gpu_accel::tests` — and every one
      # was dark: `cargo test --workspace` above does not pass `--features gpu` (the crate reports 20
      # tests instead of 47), and the two steps above are `check`/`clippy`, which compile a test without
      # running it. Deleting the odd-N decline, the f16 range decline or the route witness left all of CI
      # green. The measured delta is the whole safety net, so it gets a runner.
      #
      # Device-free by construction, which is why it can live in this job: the `gpu_accel::tests` module
      # never constructs a `Gpu`, and the six end-to-end gates in `gpu_e2e_tests` early-return through
      # `wukong_codegen_gpu::diff::skip_or_fail` when `gpu::init_error()` reports no reachable device —
      # printing `[skip]`, not passing silently. `WUKONG_GPU_REQUIRED=1` (which a rented-GPU run sets,
      # and which this step deliberately does NOT) turns those skips into failures, so the same command
      # is the device gate on real silicon and the law gate here.
      #
      # `-p wukong_driver`: `--features gpu --all-targets` over the whole workspace would additionally
      # run `wukong_codegen_gpu`'s ~470-test suite, which the local five-part gate already runs against a
      # real device (part 4); this step exists for the package that no gate part names. `--lib` keeps it
      # to the unit tests, matching the release step above.
      - name: GPU device-free laws (wukong_driver dispatch rules)
        run: cargo test -p wukong_driver --features gpu --locked --lib

  # `rust-version = "1.94"` in the workspace `Cargo.toml` is inherited by all 21 crate manifests and
  # was, until this job, a promise nothing checked: `rust-toolchain.toml` pins `channel = "stable"`
  # (not 1.94), both jobs above install `@stable`, and the local toolchain is newer still. The first
  # consumer on 1.94 would be the one to find out.
  #
  # IF THIS JOB IS RED, THE PROMISE IS FALSE AND THE FIX IS TO RAISE `rust-version` IN `Cargo.toml`
  # TO THE TRUE FLOOR - not to delete, skip or `continue-on-error` this job. A failure here is the
  # job working: it is reporting that the manifests claim a compiler the code does not build on.
  #
  # `check`, not `test`: the promise is that the crates COMPILE on 1.94, and `check` answers exactly
  # that at a fraction of the cost. `RUSTFLAGS` is emptied for this job alone, deliberately and
  # narrowly: the workflow-level `-D warnings` would turn a lint that an OLDER rustc happens to emit
  # into an MSRV failure, which is a false signal about a different question. The `-D warnings` gate
  # itself is untouched - it still runs, on current stable, in the `test` and `gpu-check` jobs.
  msrv:
    name: MSRV 1.94 compiles (rust-version promise)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Its own key: a 1.94 `target/` holds artifacts no other job's toolchain can reuse.
          key: ${{ runner.os }}-cargo-msrv194-${{ hashFiles('**/Cargo.lock') }}

      - name: Check the workspace on the declared MSRV
        run: cargo check --workspace --locked

  # MIRI IS THE ONLY GATE THAT CAN SEE A MEMORY ERROR. `wukong_runtime` is 650+ unsafe blocks and
  # 150+ C-ABI entry points of raw-pointer arithmetic, and until this job nothing in the tree -- no
  # sanitizer, no valgrind, no fuzzer -- could observe an out-of-bounds access, a use of
  # uninitialized memory, or an aliasing-rule violation. The crate is already shaped for Miri: every
  # kernel dispatches through `is_x86_feature_detected!("avx2")`, which Miri evaluates to FALSE, so
  # on the interpreter every entry falls to its portable scalar twin -- and those twins are the exact
  # raw-pointer code this job exercises. The AVX2 intrinsic bodies are never reached under Miri (it
  # does not model the x86 vector ISA), which is both why the scalar twins exist and why this lane is
  # possible at all.
  #
  # WHAT THE CURATED FILTER IS AND WHY `continue-on-error: false` is scoped to it. The one step that
  # MUST pass runs `boundary_extents` -- the per-module nonpositive/boundary-extent tests, which call
  # only the SERIAL dispatched entry points (never a `_parallel` arm, so Miri never starts a rayon
  # pool), on small well-formed disjoint buffers. Those take the scalar path under Miri and exercise
  # the guard + raw-pointer body of every module's entry without touching rayon, the filesystem, the
  # clock or an AVX2 intrinsic -- the four things the finder named as Miri blockers. It is a subset I
  # can justify line by line, which is the bar a blocking gate has to clear.
  #
  # The second step runs the FULL `--lib` suite under `continue-on-error: true`: informational
  # coverage of the whole scalar surface that must not block a campaign branch, because the broad
  # suite still contains rayon-backed `_parallel`, `std::fs` file-I/O and `std::time` tests that Miri
  # cannot run under `-Zmiri-disable-isolation` alone (those are follow-up `#[cfg_attr(miri, ignore)]`
  # work). `-Zmiri-disable-isolation` lets the clock/`getrandom` syscalls through; permissive
  # provenance accepts the crate's `ptr as usize`/`usize as *const T` smuggling on the serial surface.
  miri:
    name: Miri (wukong_runtime scalar twins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Its own key: Miri builds a distinct (nightly, miri-instrumented) `target/` graph.
          key: ${{ runner.os }}-cargo-miri-${{ hashFiles('**/Cargo.lock') }}

      # `+nightly` explicitly overrides `rust-toolchain.toml` (which pins `stable`), and `miri setup`
      # builds Miri's sysroot once so the first `miri test` does not time out doing it inline.
      - name: Miri setup
        run: cargo +nightly miri setup --locked

      # The blocking gate: the curated scalar-twin subset only. `-Zmiri-permissive-provenance`
      # accepts the pointer<->integer smuggling the kernels use; `-Zmiri-disable-isolation` allows
      # the degenerate tests' time/rng-free entry calls through without a sandbox denial.
      - name: Miri -- scalar twins (boundary + degenerate extents)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-permissive-provenance
        run: cargo +nightly miri test -p wukong_runtime --locked --lib boundary_extents

      # Informational: the whole scalar lib surface. Allowed to fail -- it still includes rayon,
      # filesystem and clock tests that need per-test `#[cfg_attr(miri, ignore)]` before they are
      # Miri-clean. Read the first fault, not the count.
      - name: Miri -- full scalar lib surface (informational)
        continue-on-error: true
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-permissive-provenance
        run: cargo +nightly miri test -p wukong_runtime --locked --lib
