name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build & test (no LLVM)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Smoke-run examples
        run: |
          cargo run -p wukongc -- --run examples/fib.wk
          cargo run -p wukongc -- --run examples/dot.wk
          cargo run -p wukongc -- --run examples/saxpy_array.wk

      - name: Optimizer effectiveness + equivalence gate
        # Release build so the heavy kernels run quickly; the harness exits non-zero if any program
        # that lowers cleanly disagrees between -O0 and -O3, so this also guards optimizer soundness.
        run: cargo run -p wukong_bench --release -- tests/run examples bench/kernels
